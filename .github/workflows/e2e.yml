name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      api_ref:
        description: "API branch to checkout"
        required: false
        default: "main"

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout shop
        uses: actions/checkout@v4

      - name: Checkout API
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/padelicense-api
          ref: ${{ inputs.api_ref || 'main' }}
          path: api
          token: ${{ secrets.REPO_DISPATCH_TOKEN }}

      - name: Create API .env
        run: |
          cat > api/.env <<'ENVEOF'
          STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }}
          SECRET_KEY_BASE=ci_secret_key_base_for_e2e_tests_at_least_64_characters_long
          ENVEOF
          sed -i 's/^ *//' api/.env

      - name: Start API
        working-directory: api
        run: docker compose up -d api

      - name: Setup database
        working-directory: api
        run: docker compose exec -T api rails db:prepare

      - name: Wait for API
        run: |
          timeout 120 bash -c 'until curl -sf http://localhost:3000/up; do sleep 3; done'

      - name: Seed database
        working-directory: api
        run: docker compose exec -T api rails db:seed

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: npx playwright install chromium --with-deps

      - name: Run E2E tests
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3000/graphql
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
        run: npx playwright test --timeout=60000

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/
          retention-days: 7

      - name: Stop API
        if: always()
        working-directory: api
        run: docker compose down
