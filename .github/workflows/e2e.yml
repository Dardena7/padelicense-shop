name: E2E Tests

on:
  repository_dispatch:
    types: [api-updated]
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout shop
        uses: actions/checkout@v4

      - name: Checkout API
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/padelicense-api
          path: api
          token: ${{ secrets.REPO_DISPATCH_TOKEN }}

      # --- Debug: vérifier ce qu'on a ---
      - name: Debug - verify checkout
        run: |
          echo "=== Shop root ==="
          ls -la
          echo "=== API root ==="
          ls -la api/
          echo "=== API Dockerfile ==="
          head -5 api/Dockerfile
          echo "=== API docker-compose.yml ==="
          cat api/docker-compose.yml

      - name: Create API .env
        run: |
          cat > api/.env <<'ENVEOF'
          STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }}
          SECRET_KEY_BASE=ci_secret_key_base_for_e2e_tests_at_least_64_characters_long
          ENVEOF
          sed -i 's/^ *//' api/.env
          echo "=== .env content (keys masked) ==="
          cat api/.env | sed 's/=.*/=***/'

      - name: Start API
        working-directory: api
        run: |
          echo "=== Starting Docker Compose ==="
          docker compose up -d api
          echo "=== Containers status ==="
          docker compose ps

      - name: Wait for API
        run: |
          echo "=== Waiting for API (max 120s) ==="
          START=$(date +%s)
          while ! curl -sf http://localhost:3000/up 2>/dev/null; do
            ELAPSED=$(( $(date +%s) - START ))
            if [ $ELAPSED -gt 120 ]; then
              echo "=== TIMEOUT after ${ELAPSED}s ==="
              echo "=== Docker containers ==="
              docker compose -f api/docker-compose.yml ps -a
              echo "=== API container logs ==="
              docker compose -f api/docker-compose.yml logs api --tail 50
              echo "=== Postgres logs ==="
              docker compose -f api/docker-compose.yml logs postgres --tail 20
              echo "=== Redis logs ==="
              docker compose -f api/docker-compose.yml logs redis --tail 10
              exit 1
            fi
            echo "  ... waiting (${ELAPSED}s elapsed)"
            sleep 5
          done
          ELAPSED=$(( $(date +%s) - START ))
          echo "=== API ready after ${ELAPSED}s ==="

      - name: Seed database
        working-directory: api
        run: |
          echo "=== Seeding database ==="
          docker compose exec -T api rails db:seed
          echo "=== Seed complete ==="

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: npx playwright install chromium --with-deps

      - name: Run E2E tests
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3000/graphql
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
        run: npx playwright test

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/
          retention-days: 7

      - name: Stop API
        if: always()
        working-directory: api
        run: docker compose down
